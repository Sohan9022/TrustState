<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Emerald Gradient (Trust & Zero-Trust Defense) -->
    <linearGradient id="ts-nexus-em" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Cyan Gradient (Runtime State & Execution Velocity) -->
    <linearGradient id="ts-nexus-cy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ts-nexus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Drop Shadow -->
    <filter id="ts-nexus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10B981" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Ambient Ethereal Glow Backdrop -->
  <circle cx="32" cy="32" r="22" fill="url(#ts-nexus-glow)" />

  <!-- Left Defensive Wing & Top Crown (The 'Trust' Shield Anchor) -->
  <path d="M32 7 C34 7 50 14.5 53 16 C54.5 16.8 55 18.5 54 20 L48 24 C47 24.8 45.5 24.5 44.5 23.8 C41 21.5 35 19 32 19 C28 19 22 21.5 19 24 C17.5 25.2 16 27.5 16 31 C16 41 24 49 32 53 C34 54 34 54 32 57 C30.5 55.5 10 44 10 30 C10 21 17 13 32 7 Z"
        fill="url(#ts-nexus-em)"
        filter="url(#ts-nexus-shadow)" />

  <!-- Right Dynamic Wing & Lower Cradle (The 'State' Runtime Foundation) -->
  <path d="M32 57 C30 57 14 49.5 11 48 C9.5 47.2 9 45.5 10 44 L16 40 C17 39.2 18.5 39.5 19.5 40.2 C23 42.5 29 45 32 45 C36 45 42 42.5 45 40 C46.5 38.8 48 36.5 48 33 C48 23 40 15 32 11 C30 10 30 10 32 7 C33.5 8.5 54 20 54 34 C54 43 47 51 32 57 Z"
        fill="url(#ts-nexus-cy)" />

  <!-- Central Verified Cryptographic Diamond Lease Node -->
  <polygon points="32,23 40,32 32,41 24,32" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="3.2" fill="#10B981" />
  <circle cx="32" cy="32" r="1.3" fill="#FFFFFF" />
</svg>