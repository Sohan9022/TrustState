<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Primary Emerald-to-Teal Gradient (Trust & Security) -->
    <linearGradient id="ts-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Secondary Cyan-to-Blue Gradient (Runtime State & Velocity) -->
    <linearGradient id="ts-grad-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Core State Spark Gradient -->
    <linearGradient id="ts-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="ts-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Layer 1: Outer Precision Shield Frame (Zero-Trust Attestation Perimeter) -->
  <path d="M32 4 L55 14 C55 14 56 32 55 36 C53 48 44 57 32 60 C20 57 11 48 9 36 C8 32 9 14 9 14 L32 4 Z"
        stroke="url(#ts-grad-primary)"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.3"
        stroke-dasharray="4 2" />

  <!-- Layer 2: Top Shield Crown & Downward 'T' Anchor (Trust Element) -->
  <!-- Chamfered geometric crest that flows into a center vertical stem -->
  <path d="M32 8.5 L51 17.5 L46 23.5 L36 18.5 V30 H28 V18.5 L18 23.5 L13 17.5 L32 8.5 Z"
        fill="url(#ts-grad-primary)"
        filter="url(#ts-glow-filter)" />

  <!-- Layer 3: Dynamic Interlocking 'S' Ribbon (State Machine & Session Loop) -->
  <!-- Sweeps from the right wall, loops through the center, and locks the shield base -->
  <path d="M50 25 C50 20.5 46.5 17 41.5 17 H34 V21.5 H41 C43 21.5 45 23 45 25 C45 27.5 43 29 40 29.5 L32 31 C26.5 32 23 36 23 41.5 C23 47.5 27.5 52 34 52 H42 V47.5 H34.5 C30 47.5 28 45 28 42 C28 39.5 30.5 37.5 34 37 L42 35.5 C47.5 34.5 50 30.5 50 25 Z"
        fill="url(#ts-grad-secondary)" />

  <!-- Layer 4: Lower Base Shield Keystone -->
  <path d="M32 57.5 L24 50 L27.5 46.5 L32 50.5 L36.5 46.5 L40 50 L32 57.5 Z"
        fill="url(#ts-grad-primary)"
        opacity="0.9" />

  <!-- Layer 5: Central Cryptographic Lease Node (Attestation Spark) -->
  <polygon points="32,26 36.5,31 32,36 27.5,31"
           fill="url(#ts-grad-core)" />
  <circle cx="32" cy="31" r="1.2" fill="#047857" />
</svg>